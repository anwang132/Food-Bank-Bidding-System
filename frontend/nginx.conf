# Static SPA + reverse proxy to two API processes (round-robin).
upstream api {
    zone api 64k;  # shared round-robin state across nginx workers
    server api-1:8000;
    server api-2:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    location /api/ws {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 1h;
    }

    # Planning uploads: the only endpoint that accepts more than 64k (FB_MAX_UPLOAD_BYTES).
    location = /api/planning/documents {
        client_max_body_size 6m;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_request_buffering on;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /assets/ {
        expires 1y;  # hashed filenames; `expires` keeps server-level add_header inheritance
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
